version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_pass_2026
      MYSQL_DATABASE: walletdigital
      MYSQL_USER: wallet_user
      MYSQL_PASSWORD: wallet_user_pass_2026
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: walletdigital:1.0
    restart: always
    ports:
      - "8080:80"
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_net
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  internal_net:
    driver: bridge

volumes:
  db_data: